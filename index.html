.mu{color:var(--mu);font-size:13px}

.badge.w{background:#fbeede;color:var(--warn)}
.badge.b{background:#e8eefb;color:#2b4a9a}
button.bt{border:1px solid var(--g);background:var(--g);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
button.bt.sec{background:#fff;color:var(--g)}

button.bt.dng{border-color:#b33;color:#b33;background:#fff}

.chip input{margin:0}
.nut{display:flex;gap:10px;font-size:13px;flex-wrap:wrap;margin-top:4px}
.nut span{background:#f2f4f2;border-radius:8px;padding:2px 8px}
.pb{height:6px;border-radius:4px;background:#e8ece9;overflow:hidden;margin-top:3px}
.pb i{display:block;height:100%;background:var(--g)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:#fff;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;width:100%;max-width:760px;padding:16px}

ul.ing{margin:4px 0;padding-left:18px}
.wk{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.warn{color:var(--warn);font-size:13px}
.hrt{cursor:pointer;font-size:19px;margin-left:4px;user-select:none}
button.bt.on{background:var(--g);color:#fff}

/* ============ Hilfsfunktionen ============ */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UN={'stk':'Stk','stück':'Stk','zehe':'Stk','zehen':'Stk','scheibe':'Stk','scheiben':'Stk','pck':'Stk','päckchen':'Stk','el':'EL','tl':'TL','g':'g','kg':'kg','ml':'ml','l':'l','prise':'prise','prisen':'prise','msp':'prise','dose':'dose','dosen':'dose','bund':'bund','becher':'becher'};
const FR={'½':.5,'¼':.25,'¾':.75,'⅓':.33};
const fixFrac=s=>s.replace(/(\d+)?\s*([½¼¾⅓])/g,(m,a,f)=>String((+a||0)+FR[f]));
const AL={'nudeln':'Spaghetti','pasta':'Spaghetti','penne':'Spaghetti','fusilli':'Spaghetti','tagliatelle':'Spaghetti','öl':'Olivenöl','speiseöl':'Olivenöl','rapsöl':'Olivenöl','sonnenblumenöl':'Olivenöl','eier':'Ei','eigelb':'Ei','kartoffeln':'Kartoffel','tomaten':'Tomate','knoblauchzehe':'Knoblauch','knoblauchzehen':'Knoblauch'};
function matchIng(raw){
  const r=String(raw).toLowerCase().replace(/\(.*?\)/g,'').replace(/[,;].*$/,'').trim();
  if(INGL[r])return INGL[r];if(AL[r])return AL[r];
  const keys=Object.keys(ING);
  for(const k of keys)if(k.includes(' ')&&r.includes(k.toLowerCase()))return k;
  const toks=r.split(/[\s\-\/]+/);let best=null;
  for(const k of keys){if(k.includes(' '))continue;const kl=k.toLowerCase();
    for(const t of toks){if(t===kl||AL[t]===k)return k;
      if(kl.length>3&&(t.startsWith(kl)||t.endsWith(kl))&&(!best||kl.length>best.length))best=k}}
  return best}
function parseLine(line){
  const s=fixFrac(String(line).trim());
  const m=s.match(/^([\d.,]+(?:\/\d+)?)\s*(kg|g|ml|l|Stk|Stück|EL|TL|Prisen?|Msp|Dosen?|Bund|Zehen?|Scheiben?|Becher|Pck|Päckchen)?\.?\s+(.+)$/i);
  if(!m)return null;
  let a=m[1].includes('/')?m[1].split('/').reduce((x,y)=>x/y):parseFloat(m[1].replace(',','.'));
  let u=UN[(m[2]||'stk').toLowerCase()]||'Stk';
  if(u==='kg'){a*=1000;u='g'}else if(u==='l'){a*=1000;u='ml'}else if(u==='prise'){u='g'}else if(u==='dose'){a*=400;u='g'}else if(u==='bund'){a*=30;u='g'}else if(u==='becher'){a*=150;u='g'}
  if(!isFinite(a))return null;
  const raw=m[3].trim();return {a,u,n:matchIng(raw)||raw};
}
function parseAny(line){
  const p=parseLine(line);if(p)return [p];
  const t=String(line).trim().replace(/^(etwas|nach Geschmack|ein paar|evtl\.?|optional:?)\s+/i,'').replace(/\s*\(.*?\)/g,'').replace(/\s+(zum|zur|nach)\s+.*$/i,'');
  if(!t)return [];
  return t.split(/\s+und\s+|,/).map(x=>x.trim()).filter(Boolean).map(x=>{const n=matchIng(x)||x;return {a:1,u:ING[n]?(ING[n].pantry?'TL':'EL'):'Stk',n}})}
const P=arr=>arr.flatMap(parseAny);
function grams(i){const d=ING[i.n];switch(i.u){case'Stk':return i.a*((d&&d.stk)||100);case'EL':return i.a*((d&&d.el)||15);case'TL':return i.a*((d&&d.tl)||5);default:return i.a}}
function nut(list){const t={k:0,p:0,c:0,f:0,unk:[]};for(const i of list){const d=ING[i.n];if(!d){t.unk.push(i.n);continue}const g=grams(i)/100;t.k+=d.k*g;t.p+=d.p*g;t.c+=d.c*g;t.f+=d.f*g}return t}
const addN=(a,b)=>({k:a.k+b.k,p:a.p+b.p,c:a.c+b.c,f:a.f+b.f,unk:a.unk.concat(b.unk||[])});
const scaleN=(a,x)=>({k:a.k*x,p:a.p*x,c:a.c*x,f:a.f*x,unk:a.unk});

const person=id=>S.persons.find(p=>p.id===id);

/* ============ Logik: wer isst was ============ */
function excludedBy(p,list){const ex=(p.exclude||'').toLowerCase().split(/[,;]/).map(s=>s.trim()).filter(Boolean);return list.some(i=>ex.some(e=>i.n.toLowerCase().includes(e)))}
function addonsFor(p,r){return (r.addons||[]).map((a,i)=>({a,i})).filter(x=>allowed(p.diet,x.a.diet)&&!excludedBy(p,x.a.ings))}
function dishFor(p,r){ // welches Rezept isst Person p, wenn r gekocht wird?
  if(r.type==='gemischt'&&!allowed(p.diet,r.diet)){const o=r.pair&&rec(r.pair);return o||null}
  return r}
function canEat(p,r){const d=dishFor(p,r);if(!d)return false;if(excludedBy(p,d.ings))return false;return allowed(p.diet,d.diet)||(d.type==='modular'&&true)}
function eaterSet(e){return (e.eaters||[]).map(person).filter(Boolean)}
function addonOf(e,p,d){ // gewählte Zusatzkomponente (-1 = ohne)
  if(d.type!=='modular')return null;
  const opts=addonsFor(p,d);let i=e.addons&&e.addons[p.id];
  if(i===undefined)i=opts.length?opts[0].i:-1;
  return i>=0?d.addons[i]:null}
function personNut(e,p){
  const r=rec(e.rid);if(!r)return null;const d=dishFor(p,r);if(!d)return null;
  let n=nut(d.ings.map(i=>({...i,a:i.a/d.serv})));
  const ad=addonOf(e,p,d);if(ad)n=addN(n,nut(ad.ings));
  return scaleN(n,Number(p.factor)||1)}
function recNut(r){return nut(r.ings.map(i=>({...i,a:i.a/r.serv})))}

/* ============ Wochenplan ============ */
let weekOff=0,tab='plan';
function weekDays(off){const d=new Date();d.setHours(12,0,0,0);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd+off*7);return [...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x})}
function entry(k){if(!S.plan[k])S.plan[k]={rid:null,eaters:S.persons.map(p=>p.id),addons:{}};return S.plan[k]}
function candidates(k,cat){
  const e=S.plan[k]||{eaters:S.persons.map(p=>p.id)};const ps=eaterSet(e);
  const used=new Set(weekDays(weekOff).map(d=>S.plan[iso(d)]&&S.plan[iso(d)].rid).filter(Boolean));
  const ok=recipes().filter(r=>ps.every(p=>canEat(p,r)));
  const pick=(f)=>ok.filter(f);
  let c=pick(r=>r.cat===cat&&!used.has(r.id));
  if(!c.length)c=pick(r=>(cat==='aufwendig'||r.cat==='schnell')&&!used.has(r.id));
  if(!c.length)c=ok;return c}
function suggest(k,cat){
  const e=entry(k),prev=e.rid;
  let c=candidates(k,cat).filter(r=>r.id!==prev&&!(e.seen||[]).includes(r.id));
  if(!c.length){e.seen=[];c=candidates(k,cat).filter(r=>r.id!==prev)}
  if(!c.length)return alert('Kein weiteres passendes Rezept für diese Mitesser gefunden.');
  if(prev)e.seen=[...(e.seen||[]),prev].slice(-20);
  e.rid=pickRand(c).id;e.addons={};save();render()}
function fillWeek(all){
  const ds=weekDays(weekOff);
  if(all)ds.forEach(d=>{const e=S.plan[iso(d)];if(e&&e.rid&&!e.lock){e.seen=[...(e.seen||[]),e.rid].slice(-20);e.rid=null;e.addons={}}});
  ds.forEach((d,i)=>{const k=iso(d);if(S.plan[k]&&S.plan[k].rid)return;
    const e=entry(k),cat=i<5?'schnell':'aufwendig';
    let c=candidates(k,cat).filter(r=>!(e.seen||[]).includes(r.id));if(!c.length)c=candidates(k,cat);
    if(c.length){e.rid=pickRand(c).id;e.addons={}}});
  save();render()}
function nutHtml(n,p){
  if(!n)return'';const goal=Number(p&&p.protein);
  return `<div class="nut"><span>${Math.round(n.k)} kcal</span><span>E ${Math.round(n.p)} g</span><span>KH ${Math.round(n.c)} g</span><span>F ${Math.round(n.f)} g</span></div>`}

function dayCard(d,wd){
  const k=iso(d),e=S.plan[k],cat=wd<5?'schnell':'aufwendig';
  const eaters=e?e.eaters:S.persons.map(p=>p.id);
  const chips=S.persons.map(p=>`<label class="chip"><input type="checkbox" data-act="eater" data-k="${k}" data-p="${p.id}" ${eaters.includes(p.id)?'checked':''}>${esc(p.name)}</label>`).join('');
  let body;const r=e&&e.rid?rec(e.rid):null;
  if(r){
    const ps=eaterSet(e);
    const lines=ps.map(p=>{const dsh=dishFor(p,r);if(!dsh)return `<div class="warn">${esc(p.name)}: kein passendes Gericht</div>`;
      const n=personNut(e,p);let extra='';
      if(dsh.type==='modular'){const opts=addonsFor(p,dsh);const cur=(()=>{let i=e.addons&&e.addons[p.id];if(i===undefined)i=opts.length?opts[0].i:-1;return i})();
        extra=`<select data-act="addon" data-k="${k}" data-p="${p.id}"><option value="-1">ohne Zusatz</option>${opts.map(o=>`<option value="${o.i}" ${o.i===cur?'selected':''}>${esc(o.a.label)}</option>`).join('')}</select>`}
      const goal=Number(p.protein);const pct=goal&&n?Math.round(n.p/goal*100):null;
      return `<div style="margin-top:8px"><div class="row sp"><b>${esc(p.name)}</b>${dsh.id!==r.id?`<span class="badge b">→ ${esc(dsh.title)}</span>`:''}</div>${extra}${nutHtml(n,p)}${pct!==null?`<div class="mu">${pct}% des Eiweißziels</div><div class="pb"><i style="width:${Math.min(pct,100)}%"></i></div>`:''}</div>`}).join('');
    const hint=r.type==='gemischt'&&new Set(ps.map(p=>dishFor(p,r)&&dishFor(p,r).id)).size>1?'<div class="warn">⚠ Zwei Gerichte nötig</div>':'';
    body=`<div class="row sp" style="margin-top:8px"><b data-act="open" data-id="${r.id}" style="cursor:pointer">${esc(r.title)} ${heart(r.id)}</b><span class="badge ${r.type==='gemischt'?'w':''}">${TYPES[r.type]}</span></div><div class="mu">${r.min} Min · ${r.cat}</div>${hint}${lines}
    <div class="row" style="margin-top:10px"><button class="bt sm sec" data-act="sug" data-k="${k}" data-cat="${cat}">🔄 Neu vorschlagen</button><button class="bt sm ${e.lock?'on':'sec'}" data-act="lock" data-k="${k}">📌 ${e.lock?'Fixiert':'Fixieren'}</button><button class="bt sm sec" data-act="pick" data-k="${k}">Wählen</button><button class="bt sm dng" data-act="clear" data-k="${k}">Leeren</button></div>`;
  }else body=`<div class="row" style="margin-top:10px"><button class="bt sm" data-act="sug" data-k="${k}" data-cat="${cat}">Vorschlag</button><button class="bt sm sec" data-act="pick" data-k="${k}">Rezept wählen</button></div>`;
  return `<div class="card"><div class="row sp"><h2 style="margin:0">${WD[wd]} ${pad(d.getDate())}.${pad(d.getMonth()+1)}.</h2><span class="badge ${cat==='schnell'?'':'w'}">${cat==='schnell'?'schnell':'aufwendiger'}</span></div><div class="row" style="margin-top:6px">${chips}</div>${body}</div>`}

function planTab(){
  const days=weekDays(weekOff);const a=days[0],b=days[6];
  return `<div class="wk"><button class="bt sm sec" data-act="wk" data-d="-1">‹</button><b>${pad(a.getDate())}.${pad(a.getMonth()+1)}. – ${pad(b.getDate())}.${pad(b.getMonth()+1)}.${weekOff===0?' (diese Woche)':''}</b><button class="bt sm sec" data-act="wk" data-d="1">›</button></div>`
   +days.map((d,i)=>dayCard(d,i)).join('')
   +`<div class="row"><button class="bt" style="flex:1" data-act="refill">🔄 Woche neu vorschlagen</button><button class="bt sec" style="flex:1" data-act="fill">Nur leere Tage füllen</button></div><div class="mu" style="margin-top:6px">📌 Fixierte Tage bleiben beim Neu-Vorschlagen erhalten.</div>`}

/* ============ Einkaufsliste ============ */
function shopList(){
  const tot={},unk={};const add=(i,x)=>{if(!ING[i.n]){const k=i.n+'|'+i.u;unk[k]=(unk[k]||0)+i.a*x;return}const g=grams(i)*x;if(!g)return;tot[i.n]=(tot[i.n]||0)+g};
  for(const d of weekDays(weekOff)){const e=S.plan[iso(d)];if(!e||!e.rid)continue;const r=rec(e.rid);if(!r)continue;
    for(const p of eaterSet(e)){const dsh=dishFor(p,r);if(!dsh)continue;const f=Number(p.factor)||1;
      dsh.ings.forEach(i=>add(i,f/dsh.serv));const ad=addonOf(e,p,dsh);if(ad)ad.ings.forEach(i=>add(i,f))}}
  const groups={};
  for(const n of Object.keys(tot)){const d=ING[n]||{a:'Sonstiges'};const g=tot[n];let txt;
    if(d.shop==='Stk'){txt=Math.ceil(g/d.stk-.01)+' Stk'}
    else if(g>=1000)txt=(Math.round(g/100)/10).toString().replace('.',',')+(d.ml?' l':' kg')
    else if(d.ml)txt=(g>=50?Math.ceil(g/10)*10:Math.ceil(g/5)*5)+' ml';
    else txt=(g>=50?Math.ceil(g/10)*10:Math.ceil(g/5)*5)+' g';
    const grp=d.pantry?'Vorrat prüfen':d.a;(groups[grp]=groups[grp]||[]).push({n,txt})}
  for(const k of Object.keys(unk)){const [n,u]=k.split('|');const v=Math.round(unk[k]*10)/10;(groups['Sonstiges']=groups['Sonstiges']||[]).push({n,txt:v+(u==='Stk'?' Stk':' '+u)})}
  return groups}
function shopTab(){
  const ws=iso(weekDays(weekOff)[0]);const ck=S.checked[ws]||{};const g=shopList();
  const order=[OG,KR,FL,TR,BR,'Sonstiges','Vorrat prüfen'];const keys=Object.keys(g).sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  const wk=`<div class="wk"><button class="bt sm sec" data-act="wk" data-d="-1">‹</button><b>Woche ab ${ws.split('-').reverse().slice(0,2).join('.')}.</b><button class="bt sm sec" data-act="wk" data-d="1">›</button></div>`;
  if(!keys.length)return wk+'<div class="card mu">Noch nichts geplant. Im Wochenplan Rezepte wählen, dann erscheint hier die Einkaufsliste.</div>';
  return wk+keys.map(k=>`<div class="card chk"><h2>${k}</h2>${g[k].sort((a,b)=>a.n.localeCompare(b.n)).map(x=>`<label><input type="checkbox" data-act="chk" data-ws="${ws}" data-n="${esc(x.n)}" ${ck[x.n]?'checked':''}><span class="${ck[x.n]?'done':''}" style="flex:1">${esc(x.n)}</span><b>${x.txt}</b></label>`).join('')}</div>`).join('')
   +`<button class="bt sec" data-act="copy">📋 Liste kopieren</button>`}

let rq='',rcat='',rtype='';

  const list=recipes().filter(r=>(!rq||r.title.toLowerCase().includes(rq.toLowerCase()))&&(!rcat||r.cat===rcat)&&(!rtype||r.type===rtype));
  return genCard()+`<div class="card"><div class="row"><input id="rq" placeholder="Suchen…" value="${esc(rq)}" style="flex:1;min-width:140px">
   <select data-act="rcat"><option value="">alle Zeiten</option><option value="schnell" ${rcat==='schnell'?'selected':''}>schnell</option><option value="aufwendig" ${rcat==='aufwendig'?'selected':''}>aufwendiger</option></select>
   <select data-act="rtype"><option value="">alle Typen</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${rtype===k?'selected':''}>${v}</option>`).join('')}</select></div>
   <button class="bt sm" style="margin-top:8px" data-act="newrec">＋ Neues Rezept</button></div>`

function recipeForm(pre){
  modal(`<div class="row sp"><h2 style="margin:0">Neues Rezept</h2><button class="bt sm sec" data-act="close">✕</button></div>
  <label class="f">Titel<input id="f_t"></label>
  <div class="row"><label class="f" style="flex:1">Zeit<select id="f_c"><option value="schnell">schnell (bis 30 Min)</option><option value="aufwendig">aufwendiger</option></select></label>

  <label class="f">Zusatzkomponenten nur bei „Modular“ (pro Person; eine pro Zeile: Name; fleisch|vegetarisch|vegan; Zutat, Zutat)<textarea id="f_a" placeholder="Hähnchen; fleisch; 150 g Hähnchenbrust, 1 TL Olivenöl"></textarea></label>
  <label class="f">Vegetarisches Pendant nur bei „Gemischt“<select id="f_p"><option value="">–</option>${recipes().filter(r=>r.type!=='gemischt').map(r=>`<option value="${r.id}">${esc(r.title)}</option>`).join('')}</select></label>
  <label class="f">Zubereitung (ein Schritt pro Zeile)<textarea id="f_st"></textarea></label>

  if(pre){const set=(id,v)=>{document.getElementById(id).value=v};

    set('f_i',pre.ings||'');set('f_st',pre.steps||'');
    const L=P((pre.ings||'').split('\n').filter(x=>x.trim())).map(i=>i.n);
    set('f_d',pre.diet&&['vegan','vegetarisch','fleisch'].includes(pre.diet)?pre.diet:L.some(n=>['Hackfleisch','Hähnchenbrust','Rindersteak'].includes(n))?'fleisch':L.some(n=>['Ei','Milch','Sahne','Butter','Feta','Halloumi','Mozzarella','Joghurt','Käse'].includes(n))?'vegetarisch':'vegan');
    updateWarn()}}
function updateWarn(){const t=document.getElementById('f_i'),w=document.getElementById('f_w');if(!t||!w)return;
  const u=[...new Set(P(t.value.split('\n').filter(x=>x.trim())).filter(i=>!ING[i.n]).map(i=>i.n))];
  w.textContent=u.length?'Ohne Nährwerte (Zutat unbekannt): '+u.join(', ')+' – diese Zutaten zählen nicht in kcal/Eiweiß, kommen aber auf die Einkaufsliste.':''}

function saveRecipe(){
  const v=id=>document.getElementById(id).value;
  const title=v('f_t').trim();const ings=P(v('f_i').split('\n').filter(x=>x.trim()));
  if(!title||!ings.length){document.getElementById('f_w').textContent='Titel und mindestens eine Zutat nötig.';return}
  const addons=v('f_a').split('\n').filter(x=>x.trim()).map(l=>{const [label,diet,rest]=l.split(';').map(s=>s.trim());return {label,diet:['fleisch','vegetarisch','vegan'].includes(diet)?diet:'vegetarisch',ings:P((rest||'').split(',').map(s=>s.trim()))}}).filter(a=>a.label);
  const type=v('f_ty');
  const r={id:'c'+Date.now(),title,cat:v('f_c'),min:+v('f_m')||30,serv:Math.max(1,+v('f_s')||2),type,diet:v('f_d'),ings,steps:v('f_st').split('\n').filter(x=>x.trim()),addons:type==='modular'?addons:[],pair:type==='gemischt'?v('f_p'):''};
  if(type==='gemischt'&&!r.pair){document.getElementById('f_w').textContent='Bei „Gemischt“ bitte ein vegetarisches Pendant wählen.';return}
  if(type==='modular'&&RDIET[r.diet]>1){document.getElementById('f_w').textContent='Bei „Modular“ muss die Basis vegan oder vegetarisch sein.';return}
  S.custom.push(r);save();closeModal();render()}



/* ============ Generator: Was kann ich kochen? ============ */
let gen={have:'',wish:'',eaters:null,res:null,ai:null,msg:''};
const genIds=()=>gen.eaters||S.persons.map(p=>p.id);
const genPersons=()=>genIds().map(person).filter(Boolean);
const terms=t=>String(t).split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);
function genSearch(){
  const ps=genPersons();
  const have=terms(gen.have).map(t=>({t:t.toLowerCase(),c:(matchIng(t)||t).toLowerCase()}));
  const wish=terms(gen.wish).map(w=>({w:w.toLowerCase(),a:(matchIng(w)||'').toLowerCase()}));
  const split=x=>x.split(/[\s\-]+/).filter(Boolean);
  const hit=(name,h)=>{const n=name.toLowerCase();if(n===h.c)return true;const nt=split(n);
    return [h.c,h.t].some(t=>{const w=split(t);return w.length&&w.every(x=>x.length>=3&&nt.some(y=>y.startsWith(x)))})};
  const MODS=['schnell','aufwendig','aufwendiger','vegetarisch','vegan'];
  const modOK=(r,m)=>m==='schnell'?r.cat==='schnell':m.startsWith('aufwendig')?r.cat==='aufwendig':m==='vegetarisch'?RDIET[r.diet]<=1:r.diet==='vegan';
  const mods=wish.filter(x=>MODS.includes(x.w)).map(x=>x.w),wish2=wish.filter(x=>!MODS.includes(x.w));
  const res=[];
  for(const r of recipes()){
    if(!ps.every(p=>canEat(p,r)))continue;
    if(!mods.every(m=>modOK(r,m)))continue;
    const names=[...new Set(r.ings.filter(i=>!(ING[i.n]&&ING[i.n].pantry)).map(i=>i.n))];
    const got=names.filter(n=>have.some(h=>hit(n,h))),miss=names.filter(n=>!got.includes(n));
    const addHit=(r.addons||[]).filter(a=>a.ings.some(i=>have.some(h=>hit(i.n,h)))).map(a=>a.label);
    const hay=(r.title+' '+names.join(' ')+' '+r.cat+' '+r.diet).toLowerCase();
    const wHit=wish2.filter(x=>hay.includes(x.w)||(x.a&&hay.includes(x.a)));
    if(have.length&&!got.length&&!addHit.length&&!wHit.length)continue;
    if(!have.length&&wish2.length&&!wHit.length)continue;
    if(!have.length&&!wish2.length&&!mods.length)continue;
    const score=(names.length&&have.length?got.length/names.length:0)+wHit.length*.4+(addHit.length?.15:0)+(S.favs[r.id]?.05:0);
    res.push({r,got,miss,addHit,wHit,score,total:names.length});
  }
  res.sort((a,b)=>b.score-a.score);gen.res=res.slice(0,12);gen.msg=res.length?'':'';render()}
function genCard(){
  const ids=genIds();
  const chips=S.persons.map(p=>`<label class="chip"><input type="checkbox" data-act="geneater" data-p="${p.id}" ${ids.includes(p.id)?'checked':''}>${esc(p.name)}</label>`).join('');
  let h=`<div class="card"><h2>🥕 Was kann ich kochen?</h2>
  <label class="f">Das habe ich zuhause<input id="gen_have" value="${esc(gen.have)}" placeholder="z. B. Hack, Zucchini, Reis"></label>
  <label class="f">Darauf habe ich Lust<input id="gen_wish" value="${esc(gen.wish)}" placeholder="z. B. Pasta, Curry, schnell"></label>
  <div class="mu" style="margin-top:8px">Wer isst mit?</div><div class="row" style="margin-top:4px">${chips}</div>

  if(auth){try{await loadHH()}catch(e){setSync('offline')}}
  setSync(syncMsg);
  setInterval(()=>{if(document.visibilityState==='visible')poll()},15000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')poll()})}

function accountTab(){
  const box=h=>`<div class="card">${h}</div>`;
  if(!auth)return box(`<h2>☁️ Anmelden</h2><div class="mu">Mit einem Konto seht ihr beide dieselben Daten, am Handy und am PC. Jeder legt ein eigenes Konto an (E-Mail + Passwort), danach verbindet ihr euch über einen Einladungscode.</div>
   <label class="f">E-Mail<input id="acc_mail" type="email" autocomplete="email"></label><label class="f">Passwort (mind. 6 Zeichen)<input id="acc_pw" type="password" autocomplete="current-password"></label>
   <div class="row" style="margin-top:10px"><button class="bt" data-act="login">Anmelden</button><button class="bt sec" data-act="register">Neu registrieren</button></div><div id="acc_s" class="warn" style="margin-top:8px"></div>`);
  if(!HH)return box(`<h2>Haushalt</h2><div class="mu">Angemeldet als ${esc(auth.email||'')}. Einer von euch legt den gemeinsamen Haushalt an, der andere tritt mit dem Code bei.</div>
   <button class="bt" style="margin-top:10px" data-act="mkhh">Neuen Haushalt anlegen</button>
   <label class="f">…oder Einladungscode eingeben<input id="acc_code" placeholder="z. B. 3fa91c0d2b7e"></label><button class="bt sec" style="margin-top:8px" data-act="joinhh">Beitreten</button>
   <div class="mu" style="margin-top:8px">Beim Beitreten werden die Daten auf diesem Gerät durch die gemeinsamen Daten ersetzt.</div><div id="acc_s" class="warn" style="margin-top:8px"></div>
   <div style="margin-top:12px"><button class="bt sm dng" data-act="logout">Abmelden</button></div>`);
  return box(`<h2>☁️ Verbunden</h2><div class="mu">Angemeldet als ${esc(auth.email||'')} · Status: ${esc(syncMsg||'…')}</div>
   <h3>Einladungscode für deine Frau</h3><div style="font-size:22px;letter-spacing:1px;font-weight:600">${esc(HH.invite_code)}</div><div class="mu">Sie registriert sich auf ihrem Gerät, wählt „Beitreten“ und gibt den Code ein.</div>
   <div class="row" style="margin-top:12px"><button class="bt sec" data-act="syncnow">Jetzt synchronisieren</button><button class="bt sm dng" data-act="logout">Abmelden</button></div><div id="acc_s" class="warn" style="margin-top:8px"></div>`)}
const accS=t=>{const e=document.getElementById('acc_s');if(e)e.textContent=t};
async function doAuth(kind){const m=(document.getElementById('acc_mail').value||'').trim(),p=document.getElementById('acc_pw').value||'';
  if(!m||p.length<6)return accS('Bitte E-Mail und ein Passwort mit mindestens 6 Zeichen eingeben.');
  accS('Einen Moment…');
  try{const ok=await authCall(kind,m,p);if(!ok)return accS('Fast geschafft: Bitte bestätige die E-Mail (Link im Postfach) und melde dich danach an.');
    await loadHH();render()}catch(e){accS(e.message)}}
async function doCreate(){accS('Lege an…');try{const a=await rpc('create_household');HH=a[0];lastPushed={};lastTs='';await pushDiff();setSync('verbunden');render()}catch(e){accS(e.message)}}
async function doJoin(){const c=(document.getElementById('acc_code').value||'').trim();if(!c)return accS('Bitte den Code eingeben.');
  if(!confirm('Die Daten auf diesem Gerät werden durch die gemeinsamen Daten ersetzt. Fortfahren?'))return;
  accS('Trete bei…');try{await rpc('join_household',{code:c});await loadHH();render()}catch(e){accS(e.message)}}
function doLogout(){auth=null;HH=null;lastPushed={};lastTs='';saveAuth();setSync('');render()}

/* ============ Grundgerüst ============ */
const TABS=[['plan','📅','Plan'],['shop','🛒','Einkauf'],['recipes','📖','Rezepte'],['favs','❤️','Favoriten'],['hist','📊','Historie'],['more','☰','Mehr']];
const SUB=['add','profile','account'];
function modal(h){document.getElementById('modal').innerHTML=`<div class="modal" data-act="bg"><div>${h}</div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}
function render(){
  document.getElementById('nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${tab===k||(k==='more'&&SUB.includes(tab))?'on':''}" data-act="tab" data-t="${k}"><b>${i}</b>${l}</button>`).join('');
  const f=document.activeElement&&document.activeElement.id==='rq';
  document.getElementById('app').innerHTML=(SUB.includes(tab)?'<button class="bt sm sec" style="margin-bottom:10px" data-act="tab" data-t="more">‹ Mehr</button>':'')+{plan:planTab,shop:shopTab,recipes:recipeTab,favs:favTab,hist:histTab,more:moreTab,add:addTab,profile:profileTab,account:accountTab}[tab]();
  if(f){const el=document.getElementById('rq');el.focus();el.setSelectionRange(el.value.length,el.value.length)}}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='bg'){if(ev.target===el)closeModal();return}
  if(['eater','addon','chk','rcat','rtype','imp-photo','geneater'].includes(a))return; // change-Events
  const k=el.dataset.k;
  switch(a){
   case'tab':tab=el.dataset.t;render();window.scrollTo(0,0);break;
   case'wk':weekOff+=+el.dataset.d;render();break;
   case'sug':suggest(k,el.dataset.cat);break;
   case'clear':delete S.plan[k];save();render();break;
   case'fill':fillWeek(false);break;
   case'refill':fillWeek(true);break;
   case'lock':{const e=entry(k);e.lock=!e.lock;save();render();break};
   case'pick':{const e=S.plan[k]||{eaters:S.persons.map(p=>p.id)};const ps=eaterSet(e);
     modal(`<div class="row sp"><h2 style="margin:0">Rezept wählen</h2><button class="bt sm sec" data-act="close">✕</button></div>`+recipes().slice().sort((a,b)=>!!S.favs[b.id]-!!S.favs[a.id]).map(r=>{const ok=ps.every(p=>canEat(p,r));return `<div class="card" ${ok?`data-act="setrec" data-k="${k}" data-id="${r.id}" style="cursor:pointer"`:'style="opacity:.45"'}><b>${S.favs[r.id]?'❤️ ':''}${esc(r.title)}</b> <span class="badge">${TYPES[r.type]}</span><div class="mu">${r.min} Min${ok?'':' · passt nicht zu den Mitessern'}</div></div>`}).join(''));break}
   case'setrec':{const e=entry(k);e.rid=el.dataset.id;e.addons={};save();closeModal();render();break}
   case'open':recipeModal(el.dataset.id);break;
   case'close':closeModal();break;
   case'newrec':case'imp-manual':recipeForm();break;
   case'imp-link':doLink();break;
   case'imp-text':doText();break;
   case'saverec':saveRecipe();break;
   case'delrec':if(confirm('Rezept löschen?')){S.custom=S.custom.filter(r=>r.id!==el.dataset.id);Object.values(S.plan).forEach(e=>{if(e.rid===el.dataset.id)e.rid=null});save();closeModal();render()}break;
   case'addp':S.persons.push({id:'p'+Date.now(),name:'Neue Person',age:'',diet:'alles',exclude:'',likes:'',protein:'',factor:1});save();render();break;
   case'delp':if(confirm('Person entfernen?')){S.persons=S.persons.filter(p=>p.id!==el.dataset.p);Object.values(S.plan).forEach(e=>e.eaters=e.eaters.filter(x=>x!==el.dataset.p));save();render()}break;
   case'fav':toggleFav(el.dataset.id);break;
   case'hmode':hmode=el.dataset.m;render();break;
   case'login':doAuth('in');break;
   case'register':doAuth('up');break;
   case'mkhh':doCreate();break;
   case'joinhh':doJoin();break;
   case'logout':doLogout();break;
   case'syncnow':accS('Synchronisiere…');pushDiff().then(()=>loadHH()).then(()=>{render()}).catch(e=>accS(e.message));break;
   case'gensearch':gen.have=document.getElementById('gen_have').value;gen.wish=document.getElementById('gen_wish').value;genSearch();break;
   case'genai':genAI();break;
   case'genadopt':{const x=gen.ai&&gen.ai[+el.dataset.i];if(x)recipeForm({title:x.title,serv:x.serv,min:x.min,ings:x.ings.join('\n'),steps:x.steps.join('\n'),diet:x.diet});break}
   case'copy':{const g=shopList();const t=Object.keys(g).map(k=>k+':\n'+g[k].map(x=>'- '+x.n+' '+x.txt).join('\n')).join('\n\n');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Kopiert.')).catch(()=>prompt('Liste:',t));break}
   case'export':{const t=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Daten in die Zwischenablage kopiert. Auf dem anderen Gerät „Importieren“ wählen und einfügen.')).catch(()=>prompt('Daten kopieren:',t));break}
   case'import':{const t=prompt('Exportierte Daten hier einfügen:');if(t){try{S=Object.assign(defaults(),JSON.parse(t));save();render()}catch(e){alert('Das waren keine gültigen Daten.')}}break}
  }});
document.addEventListener('change',ev=>{
  const el=ev.target;const a=el.dataset.act;
  if(a==='imp-photo'){doPhoto(el.files&&el.files[0]);return}
  if(a==='geneater'){const id=el.dataset.p,cur=genIds();gen.eaters=el.checked?[...new Set([...cur,id])]:cur.filter(x=>x!==id);return}
  if(el.dataset.set){S.settings=S.settings||{};S.settings[el.dataset.set]=el.value.trim();save();return}
  if(el.dataset.pf){const p=person(el.dataset.p);if(p){p[el.dataset.pf]=el.type==='number'&&el.dataset.pf==='factor'?(parseFloat(el.value)||1):el.value;save();if(el.dataset.pf==='name'||el.dataset.pf==='diet')render()}return}
  if(a==='eater'){const e=entry(el.dataset.k);const id=el.dataset.p;e.eaters=el.checked?[...new Set([...e.eaters,id])]:e.eaters.filter(x=>x!==id);save();render()}
  else if(a==='addon'){const e=entry(el.dataset.k);e.addons=e.addons||{};e.addons[el.dataset.p]=+el.value;save();render()}
  else if(a==='chk'){const ws=el.dataset.ws;S.checked[ws]=S.checked[ws]||{};S.checked[ws][el.dataset.n]=el.checked;save();render()}
  else if(a==='rcat'){rcat=el.value;render()}else if(a==='rtype'){rtype=el.value;render()}});
document.addEventListener('input',ev=>{if(ev.target.id==='rq'){rq=ev.target.value;render()}if(ev.target.id==='f_i')updateWarn();if(ev.target.id==='gen_have')gen.have=ev.target.value;if(ev.target.id==='gen_wish')gen.wish=ev.target.value});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&(ev.target.id==='gen_have'||ev.target.id==='gen_wish')){gen.have=document.getElementById('gen_have').value;gen.wish=document.getElementById('gen_wish').value;genSearch()}});
render();boot();
</script>
</body>
