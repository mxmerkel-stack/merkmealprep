<style>
:root{--ff:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--bg:#17131F;--sf:#211B2B;--sf2:#2C2438;--ink:#F3EEF7;--mu:#B1A6BC;--ln:#322A3E;--pt:#FF8F6B;--pt2:#3A2D44;--on:#17131F;--ac:#FF8F6B;--ac2:#4A2F3A;--td:#3A2D44;--dn:#FF8A80;--e:#6FD3C2;--c:#FFC857;--f:#FF8F6B;--r:20px;--sh:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--ff);padding-bottom:calc(100px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--pt);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.bar svg.logo{width:30px;height:30px;flex:none}
.bar b{font-size:18px;letter-spacing:-.01em;font-weight:800}
.syn{margin-left:auto;font-size:12.5px;color:var(--mu);display:flex;gap:6px;align-items:center}
.syn:empty{display:none}
.syn::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--mu)}
.syn.ok::before{background:var(--e)}
main{max-width:640px;margin:0 auto;padding:2px 16px 16px}
h1.pt{font-size:32px;line-height:1.1;letter-spacing:-.025em;font-weight:800;margin:8px 0 12px}
h2{font-size:18px;letter-spacing:-.01em;margin:2px 0 8px;font-weight:750}
h3{font-size:15px;margin:14px 0 6px;font-weight:700;color:var(--mu)}
.mu{color:var(--mu);font-size:13.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.gap{gap:10px}
.card{background:var(--sf);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.badge{display:inline-flex;align-items:center;font-size:12.5px;font-weight:650;padding:3px 10px;border-radius:99px;background:var(--pt2);color:var(--pt);line-height:1.4}
.badge{color:#FFB59C}.badge.w{background:var(--ac2);color:#FFB59C}.badge.b{background:#2F3B3F;color:#8FE3D4}.badge.today{background:var(--pt);color:var(--on)}
button.bt{min-height:46px;padding:0 20px;border-radius:14px;border:0;background:var(--pt);color:var(--on);font:700 15px/1 var(--ff);cursor:pointer;transition:transform .08s}
button.bt.sec{background:var(--pt2);color:var(--pt)}
button.bt.sm{min-height:40px;padding:0 15px;font-size:14px}
button.bt.dng{background:transparent;color:var(--dn);box-shadow:inset 0 0 0 1.5px var(--dn)}
button.bt.on{background:var(--pt);color:var(--on)}
button.bt.sq{width:44px;padding:0;font-size:22px}
button:active{transform:scale(.97)}
input,select,textarea{font:inherit;min-height:46px;padding:10px 13px;border:1.5px solid var(--ln);border-radius:13px;background:var(--sf);color:var(--ink);max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pt);outline-offset:1px;border-color:transparent}
textarea{width:100%;min-height:96px}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--pt)}
label.f{display:block;font-size:13.5px;color:var(--mu);margin-top:10px;font-weight:600}
label.f input,label.f select{display:block;width:100%;margin-top:4px;color:var(--ink);font-size:16px;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border-radius:99px;background:var(--sf2);font-size:15px;font-weight:600}
.warn{color:var(--dn);font-size:13.5px}
.hrt{cursor:pointer;font-size:19px;margin-left:4px;user-select:none;display:inline-block;padding:2px}
.pb{height:6px;border-radius:4px;background:var(--sf2);overflow:hidden;margin-top:4px}.pb i{display:block;height:100%;background:var(--e);border-radius:4px}
ul.ing{margin:4px 0;padding-left:20px}ul.ing li{margin:3px 0}
ol{padding-left:20px}ol li{margin:6px 0}
/* Navigation */
nav{box-shadow:0 10px 32px rgba(0,0,0,.55)!important;position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;z-index:9;display:flex;background:var(--sf);background:color-mix(in srgb,var(--sf) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:28px;box-shadow:0 10px 32px rgba(8,20,22,.2);padding:7px 4px}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mu);font:650 11px/1 var(--ff);padding:2px 0;cursor:pointer}
nav button span{display:grid;place-items:center;width:54px;height:31px;border-radius:16px;transition:background .15s}
nav button.on{color:#FFB59C}nav button.on span{background:var(--pt2)}
/* Wochenleiste */
.wk{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.wkt{text-align:center;line-height:1.25}.wkt b{display:block;font-size:16px}.wkt span{font-size:13px;color:var(--mu)}
.wstrip{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:5;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:6px 0 10px;background:var(--bg)}
.wb{position:relative;border:1.5px solid var(--ln);background:var(--sf);border-radius:13px;padding:13px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink);cursor:pointer}
.wb::before{content:'';position:absolute;left:7px;right:7px;top:5px;height:4px;border-radius:3px;background:var(--ln)}
.wb .wl{font-size:11.5px;color:var(--mu);font-weight:650}.wb .wd{font-size:17px;font-weight:800}
.wb.on{background:var(--pt2);border-color:transparent}.wb.on::before{background:var(--e)}
.wb.td{border-color:var(--ac);box-shadow:0 0 0 1.5px var(--ac)}
/* Tageskarte */
.day{position:relative;background:var(--sf);border-radius:var(--r);margin-bottom:14px;padding:16px 16px 14px 22px;box-shadow:var(--sh);overflow:hidden;scroll-margin-top:150px}
.day::before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--e)}
.day.w::before{background:var(--ac)}
.day.td{box-shadow:0 0 0 2px var(--ac),var(--sh)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dh b{font-size:15px;font-weight:800}.dh .dt{font-size:14px;color:var(--mu);margin:0 8px 0 7px}
.tag{font-size:12.5px;font-weight:650;color:var(--mu)}
.rt{font-size:21px;line-height:1.2;font-weight:800;letter-spacing:-.015em;margin:8px 0 6px;cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.facts{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px;color:var(--mu)}
.facts .ic{display:inline-flex;align-items:center;gap:5px}.facts svg.i{width:16px;height:16px}
.eaters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.ep{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 13px 0 5px;border-radius:99px;border:1.5px solid var(--ln);background:transparent;color:var(--mu);font:650 14px/1 var(--ff);cursor:pointer}
.ep.on{background:var(--pt2);border-color:transparent;color:var(--ink)}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ln);color:var(--ink);font-size:13px;font-weight:800;flex:none}
.ep.on .av,.av.a0{background:var(--pt);color:var(--on)}
.ep.on.a1 .av,.av.a1{background:#6FD3C2;color:#17131F}.ep.on.a2 .av,.av.a2{background:#C3A6FF;color:#17131F}.ep.on.a3 .av,.av.a3{background:#FFC857;color:#17131F}
.pr{padding:12px 0;border-top:1px solid var(--ln)}
.prh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.prh b{font-size:15px}.kc2{margin-left:auto;font-weight:800;font-size:15px}
.pr select{width:100%;margin-top:8px}
.lnk{border:0;background:none;color:var(--pt);font:700 14px var(--ff);padding:0;min-height:40px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.lnk svg.i{width:16px;height:16px}
.acts{display:flex;gap:8px;margin-top:8px}
.ib{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:1;min-height:56px;padding:8px 4px;border:0;border-radius:15px;background:var(--sf2);color:var(--ink);font:650 12px/1.1 var(--ff);cursor:pointer;text-align:center}
.ib svg.i{width:20px;height:20px}.ib.on{background:var(--pt);color:var(--on)}
.empty{margin:10px 0 12px;color:var(--mu)}
/* Nährwerte */
.pr .mx .kc{display:none}
.mx .kc{font-size:21px;font-weight:800}.mx .kc small{font-size:13px;font-weight:650;color:var(--mu)}
.mbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--sf2);margin:6px 0 7px;gap:2px}.mbar i{display:block;height:100%;border-radius:2px}
.ml{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:13px;color:var(--mu)}.ml i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
/* Listen */
.list{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:14px}
.li{display:flex;gap:12px;align-items:center;padding:14px 16px;min-height:66px;cursor:pointer}
.li+.li{border-top:1px solid var(--ln)}
.lm{flex:1;min-width:0}.lm b{display:block;font-size:16px;line-height:1.25}
.lm .facts{margin-top:4px}.lr{text-align:right;line-height:1.1}.lr b{font-size:17px;font-weight:800}.lr small{display:block;font-size:11.5px;color:var(--mu)}
.li .ico{width:42px;height:42px;border-radius:13px;background:var(--pt2);color:var(--pt);display:grid;place-items:center;flex:none}
.dd::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--e)}
.dd.d-vegetarisch::before{background:var(--c)}.dd.d-fleisch::before{background:var(--f)}
/* Einkauf */
.chk label{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--ln);align-items:center;min-height:50px}
.chk label:last-child{border-bottom:0}
.chk input{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ln);background:transparent;display:grid;place-items:center;flex:none;margin:0}
.chk input:checked{background:var(--pt);border-color:var(--pt)}
.chk input:checked::after{content:'';width:6px;height:11px;border:solid var(--on);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk .done{text-decoration:line-through;color:var(--mu)}
/* Sheets */
.modal{position:fixed;inset:0;z-index:30;background:rgba(8,20,22,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.modal>div{background:var(--sf);border-radius:28px 28px 0 0;max-height:92vh;overflow:auto;width:100%;max-width:640px;padding:10px 18px calc(24px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.8,.2,1)}
.modal>div::before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 14px}
.stack{display:grid;gap:10px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#F3EEF7;color:#17131F;padding:12px 18px;border-radius:14px;font-weight:650;font-size:14.5px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .2s}
.back{margin:0 0 4px}
.wh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px}
.wh h1{font-size:44px;line-height:1;letter-spacing:-.03em;font-weight:800;margin:0}
.wl{background:var(--sf);border-radius:var(--r);overflow:hidden}
.wr{display:flex;align-items:center;gap:14px;padding:0 16px;min-height:72px;border-top:1px solid var(--ln);cursor:pointer}
.wr:first-child{border-top:0}.wr.td{background:var(--td)}
.wr .wd{width:42px;flex:none}.wr .wd span{display:block;font-size:13px;font-weight:700;color:var(--mu)}.wr .wd b{display:block;font-size:24px;font-weight:800;line-height:1.05}
.wr .wm{flex:1;min-width:0;padding:10px 0}.wr .wt{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr .ws{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:13px;color:var(--mu);flex-wrap:wrap}.ws svg.i{width:15px;height:15px}
.wr .wk2{text-align:right;flex:none}.wr .wk2 b{display:block;font-size:18px;font-weight:800;line-height:1}.wr .wk2 small{font-size:12px;color:var(--mu)}
.av.s{width:20px;height:20px;font-size:11px}
.dv-top{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
.pager{display:flex;gap:2px;margin:0 -4px 4px}
.pg{flex:1;min-height:54px;border:0;border-radius:16px;background:transparent;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;position:relative}
.pg span{font-size:12px;font-weight:700}.pg b{font-size:18px;font-weight:800}
.pg.on{background:var(--pt);color:var(--on)}
.pg.has::after{content:'';position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:var(--mu)}.pg.on.has::after{background:var(--on)}
.plate{display:flex;justify-content:center;margin:12px 0 2px}
.dtitle{font-size:31px;line-height:1.1;font-weight:800;letter-spacing:-.025em;margin:10px 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.seg{display:flex;gap:8px;margin-top:14px}.seg button{flex:1;min-height:44px;border:0;border-radius:14px;background:var(--sf2);color:var(--ink);font:700 15px var(--ff);cursor:pointer}.seg button.on{background:var(--pt);color:var(--on)}
.np{background:var(--sf);border-radius:22px;padding:16px;margin-top:12px}.np select{width:100%;margin-bottom:14px}
.donut{position:relative;width:104px;height:104px;flex:none}.donut svg{transform:rotate(-90deg)}
.donut div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.donut b{font-size:22px;line-height:1}.donut small{font-size:12px;color:var(--mu)}
.lg{flex:1;display:grid;gap:9px;font-size:15px}.lg div{display:flex;justify-content:space-between;align-items:center}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.gt{display:flex;width:100%;align-items:center;justify-content:space-between;border:0;background:none;color:var(--ink);padding:0;font:inherit;cursor:pointer;min-height:36px}
.gc .mu{margin-top:2px}
.fl select{flex:1 1 130px}
@keyframes up{from{transform:translateY(36px);opacity:0}}@keyframes fade{from{opacity:0}}
@media(min-width:700px){.modal{align-items:center}.modal>div{border-radius:28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function matchIng(raw){
  const r=String(raw).toLowerCase().replace(/\(.*?\)/g,'').replace(/[,;].*$/,'').trim();
  if(INGL[r])return INGL[r];if(AL[r])return AL[r];
  const keys=Object.keys(ING);
  for(const k of keys)if(k.includes(' ')&&r.includes(k.toLowerCase()))return k;
  const toks=r.split(/[\s\-\/]+/);let best=null;
  for(const k of keys){if(k.includes(' '))continue;const kl=k.toLowerCase();
    for(const t of toks){if(t===kl||AL[t]===k)return k;
      if(kl.length>3&&(t.startsWith(kl)||t.endsWith(kl))&&(!best||kl.length>best.length))best=k}}
  return best}
function parseLine(line){
  const s=fixFrac(String(line).trim());
  const m=s.match(/^([\d.,]+(?:\/\d+)?)\s*(kg|g|ml|l|Stk|Stück|EL|TL|Prisen?|Msp|Dosen?|Bund|Zehen?|Scheiben?|Becher|Pck|Päckchen)?\.?\s+(.+)$/i);
  if(!m)return null;
  let a=m[1].includes('/')?m[1].split('/').reduce((x,y)=>x/y):parseFloat(m[1].replace(',','.'));
  let u=UN[(m[2]||'stk').toLowerCase()]||'Stk';
  if(u==='kg'){a*=1000;u='g'}else if(u==='l'){a*=1000;u='ml'}else if(u==='prise'){u='g'}else if(u==='dose'){a*=400;u='g'}else if(u==='bund'){a*=30;u='g'}else if(u==='becher'){a*=150;u='g'}
  if(!isFinite(a))return null;
  const raw=m[3].trim();return {a,u,n:matchIng(raw)||raw};
}

  if(!t)return [];

/* ============ Zustand ============ */
const KEY='essensplaner_v1';
const defaults=()=>({persons:[
 {id:'p1',name:'Maximilian',age:'',diet:'alles',exclude:'',likes:'',protein:'',factor:1},
 {id:'p2',name:'Partnerin',age:'',diet:'vegetarisch',exclude:'',likes:'',protein:'',factor:1}],
 custom:[],plan:{},checked:{},settings:{worker:'',token:''},favs:{},customIng:{},ratings:{}});
let S;
try{S=Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'null')||{})}catch(e){S=defaults()}
function applyCustomIng(){for(const n of Object.keys(S.customIng||{})){ING[n]=S.customIng[n];INGL[n.toLowerCase()]=n}}
applyCustomIng();
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{saveLocal();schedulePush()};
const recipes=()=>{const ids=new Set(S.custom.map(r=>r.id));return SEED.filter(r=>!ids.has(r.id)).concat(S.custom)};
const rec=id=>recipes().find(r=>r.id===id);
const person=id=>S.persons.find(p=>p.id===id);

/* ============ Logik: wer isst was ============ */
function excludedBy(p,list){const ex=(p.exclude||'').toLowerCase().split(/[,;]/).map(s=>s.trim()).filter(Boolean);return list.some(i=>ex.some(e=>i.n.toLowerCase().includes(e)))}
function addonsFor(p,r){return (r.addons||[]).map((a,i)=>({a,i})).filter(x=>allowed(p.diet,x.a.diet)&&!excludedBy(p,x.a.ings))}
function dishFor(p,r){ // welches Rezept isst Person p, wenn r gekocht wird?
  if(r.type==='gemischt'&&!allowed(p.diet,r.diet)){const o=r.pair&&rec(r.pair);return o||null}
  return r}
function canEat(p,r){const d=dishFor(p,r);if(!d)return false;if(excludedBy(p,d.ings))return false;return allowed(p.diet,d.diet)||(d.type==='modular'&&true)}
function eaterSet(e){return (e.eaters||[]).map(person).filter(Boolean)}
function addonOf(e,p,d){ // gewählte Zusatzkomponente (-1 = ohne)
  if(d.type!=='modular')return null;
  const opts=addonsFor(p,d);let i=e.addons&&e.addons[p.id];
  if(i===undefined)i=opts.length?opts[0].i:-1;
  return i>=0?d.addons[i]:null}
function personNut(e,p){
  const r=rec(e.rid);if(!r)return null;const d=dishFor(p,r);if(!d)return null;
  let n=nut(d.ings.map(i=>({...i,a:i.a/d.serv})));
  const ad=addonOf(e,p,d);if(ad)n=addN(n,nut(ad.ings));
  return scaleN(n,Number(p.factor)||1)}
function recNut(r){return nut(r.ings.map(i=>({...i,a:i.a/r.serv})))}

/* ============ Wochenplan ============ */
let weekOff=0,tab='plan';
function weekDays(off){const d=new Date();d.setHours(12,0,0,0);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd+off*7);return [...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x})}
function defE(k){const wd=(new Date(k+'T12:00').getDay()+6)%7;const l=S.persons.filter(p=>!p.days||p.days.includes(wd)).map(p=>p.id);return l.length?l:S.persons.map(p=>p.id)}
function entry(k){if(!S.plan[k])S.plan[k]={rid:null,eaters:defE(k),addons:{}};return S.plan[k]}
function candidates(k,cat){
  const e=S.plan[k]||{eaters:defE(k)};const ps=eaterSet(e);
  const used=new Set(weekDays(weekOff).map(d=>S.plan[iso(d)]&&S.plan[iso(d)].rid).filter(Boolean));
  const ok0=recipes().filter(r=>ps.every(p=>canEat(p,r)));const liked=ok0.filter(r=>(S.ratings||{})[r.id]!==-1);const ok=liked.length?liked:ok0;
  const pick=(f)=>ok.filter(f);
  let c=pick(r=>r.cat===cat&&!used.has(r.id));
  if(!c.length)c=pick(r=>(cat==='aufwendig'||r.cat==='schnell')&&!used.has(r.id));
  if(!c.length)c=ok;return c}
function suggest(k,cat){
  const e=entry(k),prev=e.rid;
  let c=candidates(k,cat).filter(r=>r.id!==prev&&!(e.seen||[]).includes(r.id));
  if(!c.length){e.seen=[];c=candidates(k,cat).filter(r=>r.id!==prev)}
  if(!c.length)return toast('Kein weiteres passendes Rezept für diese Mitesser gefunden.');
  if(prev)e.seen=[...(e.seen||[]),prev].slice(-20);
  e.rid=pickRand(c).id;e.addons={};save();render()}
function fillWeek(all){
  const ds=weekDays(weekOff);
  if(all)ds.forEach(d=>{const e=S.plan[iso(d)];if(e&&e.rid&&!e.lock){e.seen=[...(e.seen||[]),e.rid].slice(-20);e.rid=null;e.addons={}}});
  ds.forEach((d,i)=>{const k=iso(d);if(S.plan[k]&&S.plan[k].rid)return;
    const e=entry(k),cat=i<5?'schnell':'aufwendig';
    let c=candidates(k,cat).filter(r=>!(e.seen||[]).includes(r.id));if(!c.length)c=candidates(k,cat);
    if(c.length){e.rid=pickRand(c).id;e.addons={}}});
  save();render()}
function nutHtml(n){
  if(!n)return'';const kc=Math.max(1,n.p*4+n.c*4+n.f*9),w=x=>Math.max(0,Math.round(x/kc*100));
  return `<div class="mx"><div class="kc">${Math.round(n.k)}<small> kcal</small></div><div class="mbar" role="img" aria-label="Eiweiß ${Math.round(n.p)} g, Kohlenhydrate ${Math.round(n.c)} g, Fett ${Math.round(n.f)} g"><i style="width:${w(n.p*4)}%;background:var(--e)"></i><i style="width:${w(n.c*4)}%;background:var(--c)"></i><i style="width:${w(n.f*9)}%;background:var(--f)"></i></div><div class="ml"><span><i style="background:var(--e)"></i>Eiweiß ${Math.round(n.p)} g</span><span><i style="background:var(--c)"></i>Kohlenhydrate ${Math.round(n.c)} g</span><span><i style="background:var(--f)"></i>Fett ${Math.round(n.f)} g</span></div></div>`}

function plateSvg(diet){
  if(!diet)return `<svg width="120" height="120" viewBox="0 0 128 128" aria-hidden="true"><circle cx="64" cy="64" r="60" fill="none" stroke="var(--ln)" stroke-width="3" stroke-dasharray="8 7"/></svg>`;
  const main=diet==='fleisch'?'#FF8F6B':diet==='vegan'?'#6FD3C2':'#FFC857',s1=diet==='vegan'?'#FFC857':'#6FD3C2',s2=diet==='fleisch'?'#FFC857':'#FF8F6B';
  return `<svg width="120" height="120" viewBox="0 0 128 128" aria-hidden="true"><circle cx="64" cy="64" r="62" fill="#EDE6F2"/><circle cx="64" cy="64" r="50" fill="none" stroke="#D8CCE0" stroke-width="3"/><path d="M34 70c0-22 20-34 38-30 14 3 24 14 22 30-2 14-14 22-30 22-18 0-30-8-30-22z" fill="${main}"/><circle cx="88" cy="46" r="13" fill="${s1}"/><circle cx="46" cy="94" r="10" fill="${s2}"/></svg>`}
function donut(n){
  const C=251.33,kc=Math.max(1,n.p*4+n.c*4+n.f*9),a=n.p*4/kc*C,b=n.c*4/kc*C,c=n.f*9/kc*C;
  const seg=(len,off,col)=>{const l=Math.max(0,len-2);return `<circle cx="52" cy="52" r="40" fill="none" style="stroke:${col}" stroke-width="13" stroke-dasharray="${l.toFixed(1)} ${(C-l).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"/>`};
  return `<div class="donut"><svg width="104" height="104" viewBox="0 0 104 104" role="img" aria-label="Eiweiß ${Math.round(n.p)} g, Kohlenhydrate ${Math.round(n.c)} g, Fett ${Math.round(n.f)} g"><circle cx="52" cy="52" r="40" fill="none" style="stroke:var(--sf2)" stroke-width="13"/>${seg(a,0,'var(--e)')}${seg(b,a,'var(--c)')}${seg(c,a+b,'var(--f)')}</svg><div><b>${Math.round(n.k)}</b><small>kcal</small></div></div>`}
function dayTab(){
  const k=dayK||iso(new Date()),d=new Date(k+'T12:00'),wd=(d.getDay()+6)%7,cat=wd<5?'schnell':'aufwendig',mon=mondayOf(k);
  const days=[...Array(7)].map((_,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return x});
  const e=S.plan[k],r=e&&e.rid?rec(e.rid):null,eaters=e?e.eaters:defE(k),rs=resteFor(d);
  const top=`<div class="dv-top"><button class="bt sec sm" data-act="tab" data-t="plan">${ico('back')}Woche ${isoWeek(mon)}</button>${k===iso(new Date())?'<span class="badge today">Heute</span>':''}</div>`;
  const pager=`<div class="pager">${days.map((x,i)=>{const kk=iso(x),ee=S.plan[kk];return `<button class="pg ${kk===k?'on':''} ${ee&&ee.rid?'has':''}" data-act="openday" data-k="${kk}" aria-label="${DAYN[i]} ${x.getDate()}.${x.getMonth()+1}."${kk===k?' aria-current="date"':''}><span>${WD[i]}</span><b>${x.getDate()}</b></button>`}).join('')}</div>`;
  const pills=S.persons.map((p,i)=>{const on=eaters.includes(p.id);return `<button class="ep a${i%4} ${on?'on':''}" aria-pressed="${on}" data-act="eatert" data-k="${k}" data-p="${p.id}"><span class="av a${i%4}">${ini(p)}</span>${esc(p.name)}</button>`}).join('');
  const reste=rs?`<div class="facts" style="margin-top:8px"><span class="badge b">Mittags: Reste von „${esc(rs.title)}“</span></div>`:'';
  if(!r)return top+pager+`<div class="plate">${plateSvg(null)}</div><div class="dtitle">${DAYN[wd]}, ${d.getDate()}.${d.getMonth()+1}.</div><p class="mu" style="margin:0">Noch nichts geplant.</p>${reste}<div class="eaters">${pills}</div><div class="stack" style="margin-top:12px"><button class="bt" data-act="sug" data-k="${k}" data-cat="${cat}">Vorschlag machen</button><button class="bt sec" data-act="pick" data-k="${k}">Rezept wählen</button></div>`;
  const ps=eaterSet(e),P=ps.find(p=>p.id===dayP)||ps[0];let panel='';
  if(P){const dsh=dishFor(P,r);
    if(!dsh)panel=`<div class="np"><div class="warn">Für ${esc(P.name)} passt kein Gericht.</div></div>`;
    else{const n=personNut(e,P);let extra='';
      if(dsh.type==='modular'){const opts=addonsFor(P,dsh);let cur=e.addons&&e.addons[P.id];if(cur===undefined)cur=opts.length?opts[0].i:-1;
        extra=`<select aria-label="Zusatz für ${esc(P.name)}" data-act="addon" data-k="${k}" data-p="${P.id}"><option value="-1">ohne Zusatz</option>${opts.map(o=>`<option value="${o.i}" ${o.i===cur?'selected':''}>${esc(o.a.label)}</option>`).join('')}</select>`}
      const goal=Number(P.protein),pct=goal&&n?Math.round(n.p/goal*100):null;
      panel=`<div class="np">${dsh.id!==r.id?`<div style="margin-bottom:12px"><span class="badge w">${esc(P.name)} isst: ${esc(dsh.title)}</span></div>`:''}${extra}${n?`<div style="display:flex;align-items:center;gap:16px">${donut(n)}<div class="lg"><div><span><i style="background:var(--e)"></i>Eiweiß</span><b>${Math.round(n.p)} g</b></div><div><span><i style="background:var(--c)"></i>Kohlenhydrate</span><b>${Math.round(n.c)} g</b></div><div><span><i style="background:var(--f)"></i>Fett</span><b>${Math.round(n.f)} g</b></div></div></div>${pct!==null?`<div class="mu" style="margin-top:14px">${pct} % vom Eiweißziel</div><div class="pb"><i style="width:${Math.min(pct,100)}%"></i></div>`:''}`:''}</div>`}}
  else panel=`<p class="mu">Niemand isst mit. Wähle oben aus, wer dabei ist.</p>`;
  const seg=ps.length>1?`<div class="seg">${ps.map(p=>`<button class="${p.id===P.id?'on':''}" aria-pressed="${p.id===P.id}" data-act="dayp" data-p="${p.id}">${esc(p.name)}</button>`).join('')}</div>`:'';
  return top+pager+`<div class="plate">${plateSvg(r.diet)}</div><div class="dtitle"><span data-act="open" data-id="${r.id}" style="cursor:pointer">${esc(r.title)}</span>${heart(r.id)}</div>
  <div class="facts"><span class="ic">${ico('clock')}${r.min} Min</span><span class="badge">${TYPES[r.type]}</span>${twoDishes(r,ps)?'<span class="badge w">Zwei Gerichte nötig</span>':''}<button class="lnk" style="min-height:0" data-act="open" data-id="${r.id}">Rezept ansehen</button></div>${reste}
  <div class="mu" style="margin:14px 0 -4px;font-size:13px;font-weight:700">Wer isst mit</div><div class="eaters">${pills}</div>${seg?'<div class="mu" style="margin:14px 0 -6px;font-size:13px;font-weight:700">Nährwerte für</div>'+seg:''}${panel}
  <div class="acts" style="margin-top:12px"><button class="ib" data-act="sug" data-k="${k}" data-cat="${cat}">${ico('refresh')}Neu</button><button class="ib ${e.lock?'on':''}" data-act="lock" data-k="${k}" aria-pressed="${!!e.lock}">${ico('pin')}${e.lock?'Fixiert':'Fixieren'}</button><button class="ib ${e.prep?'on':''}" data-act="prep" data-k="${k}" aria-pressed="${!!e.prep}">${ico('box')}${e.prep?'Doppelt':'Doppelt kochen'}</button><button class="ib" data-act="dmore" data-k="${k}">${ico('more')}Mehr</button></div>`}
function shiftDay(n){const d=new Date((dayK||iso(new Date()))+'T12:00');d.setDate(d.getDate()+n);dayK=iso(d);render()}
function weekSummary(){
  const ds=weekDays(weekOff);
  const rows=S.persons.map(p=>{let t={k:0,p:0,c:0,f:0,unk:[]},n=0;ds.forEach(d=>{const e=S.plan[iso(d)];if(!e||!e.rid||!(e.eaters||[]).includes(p.id))return;const x=personNut(e,p);if(x){t=addN(t,x);n++}});return {p,t,n}}).filter(x=>x.n);
  if(!rows.length)return '';
  return `<div class="card"><h2 style="margin-top:6px">Wochenübersicht</h2><div class="mu">Durchschnitt pro geplantem Abendessen (ohne Frühstück, Mittag und Reste).</div>`+rows.map(({p,t,n})=>{const a={k:t.k/n,p:t.p/n,c:t.c/n,f:t.f/n};const goal=Number(p.protein);const pct=goal?Math.round(a.p/goal*100):null;
    return `<div style="margin-top:8px"><b>${esc(p.name)}</b> <span class="mu">(${n} ${n===1?'Tag':'Tage'})</span>${nutHtml(a)}${pct!==null?`<div class="mu">Eiweiß: ${pct}% des Tagesziels pro Abendessen</div><div class="pb"><i style="width:${Math.min(pct,100)}%"></i></div>`:''}</div>`}).join('')+'</div>'}
const icsEsc=t=>String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
const icsFold=l=>{const c=Array.from(l);if(c.length<=60)return l;const o=[];for(let i=0;i<c.length;i+=60)o.push((i?' ':'')+c.slice(i,i+60).join(''));return o.join('\r\n')};
function buildIcs(){
  const now=new Date(),st=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MerkMealPrep//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH'];let n=0;
  weekDays(weekOff).forEach(d=>{const k=iso(d),e=S.plan[k];if(!e||!e.rid)return;const r=rec(e.rid);if(!r)return;n++;const ymd=k.replace(/-/g,'');
    const who=eaterSet(e).map(p=>{const dsh=dishFor(p,r);if(!dsh)return p.name+': –';const ad=addonOf(e,p,dsh),nu=personNut(e,p);return p.name+': '+(dsh.id!==r.id?dsh.title+' ':'')+(ad?'mit '+ad.label+' ':'')+(nu?'('+Math.round(nu.k)+' kcal, '+Math.round(nu.p)+' g Eiweiß)':'')}).join('\n');
    const desc=who+(e.prep?'\n🍱 Doppelt gekocht – Reste für morgen':'')+'\n\nZutaten (für '+r.serv+' Portionen):\n'+r.ings.map(ingLine).join('\n');
    ['BEGIN:VEVENT','UID:essensplan-'+k+'@merkmealprep','DTSTAMP:'+st,'DTSTART:'+ymd+'T183000','DTEND:'+ymd+'T193000','SUMMARY:'+icsEsc('🍽 '+r.title),'DESCRIPTION:'+icsEsc(desc),'END:VEVENT'].forEach(x=>L.push(x))});
  L.push('END:VCALENDAR');return {n,text:L.map(icsFold).join('\r\n')+'\r\n'}}
function downloadIcs(){const x=buildIcs();if(!x.n)return toast('Diese Woche ist noch nichts geplant.');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x.text],{type:'text/calendar;charset=utf-8'}));a.download='essensplan-'+iso(weekDays(weekOff)[0])+'.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ============ Einkaufsliste ============ */
function shopList(){
  const tot={},unk={};const add=(i,x)=>{if(!ING[i.n]){const k=i.n+'|'+i.u;unk[k]=(unk[k]||0)+i.a*x;return}const g=grams(i)*x;if(!g)return;tot[i.n]=(tot[i.n]||0)+g};
  for(const d of weekDays(weekOff)){const e=S.plan[iso(d)];if(!e||!e.rid)continue;const r=rec(e.rid);if(!r)continue;
    for(const p of eaterSet(e)){const dsh=dishFor(p,r);if(!dsh)continue;const f=(Number(p.factor)||1)*(e.prep?2:1);
      dsh.ings.forEach(i=>add(i,f/dsh.serv));const ad=addonOf(e,p,dsh);if(ad)ad.ings.forEach(i=>add(i,f))}}
  const groups={};
  for(const n of Object.keys(tot)){const d=ING[n]||{a:'Sonstiges'};const g=tot[n];let txt;
    if(d.shop==='Stk'){txt=Math.ceil(g/d.stk-.01)+' Stk'}
    else if(g>=1000)txt=(Math.round(g/100)/10).toString().replace('.',',')+(d.ml?' l':' kg')
    else if(d.ml)txt=(g>=50?Math.ceil(g/10)*10:Math.ceil(g/5)*5)+' ml';
    else txt=(g>=50?Math.ceil(g/10)*10:Math.ceil(g/5)*5)+' g';
    const grp=d.pantry?'Vorrat prüfen':d.a;(groups[grp]=groups[grp]||[]).push({n,txt})}
  for(const k of Object.keys(unk)){const [n,u]=k.split('|');const v=Math.round(unk[k]*10)/10;(groups['Sonstiges']=groups['Sonstiges']||[]).push({n,txt:v+(u==='Stk'?' Stk':' '+u)})}
  return groups}
function shopTab(){
  const ws=iso(weekDays(weekOff)[0]);const ck=S.checked[ws]||{};const g=shopList();
  const order=[OG,KR,FL,TR,BR,'Sonstiges','Vorrat prüfen'];const keys=Object.keys(g).sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  const wk=`<div class="wk"><button class="bt sm sec" data-act="wk" data-d="-1">‹</button><b>Woche ab ${ws.split('-').reverse().slice(0,2).join('.')}.</b><button class="bt sm sec" data-act="wk" data-d="1">›</button></div>`;
  if(!keys.length)return wk+'<div class="card mu">Noch nichts geplant. Im Wochenplan Rezepte wählen, dann erscheint hier die Einkaufsliste.</div>';
  return wk+keys.map(k=>`<div class="card chk"><h2>${k}</h2>${g[k].sort((a,b)=>a.n.localeCompare(b.n)).map(x=>`<label><input type="checkbox" data-act="chk" data-ws="${ws}" data-n="${esc(x.n)}" ${ck[x.n]?'checked':''}><span class="${ck[x.n]?'done':''}" style="flex:1">${esc(x.n)}</span><b>${x.txt}</b></label>`).join('')}</div>`).join('')
   +`<button class="bt sec" data-act="copy">📋 Liste kopieren</button>`}

let gen={have:'',wish:'',eaters:null,res:null,ai:null,msg:'',open:false};

const terms=t=>String(t).split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);
function genSearch(){
  const ps=genPersons();
  const have=terms(gen.have).map(t=>({t:t.toLowerCase(),c:(matchIng(t)||t).toLowerCase()}));
  const wish=terms(gen.wish).map(w=>({w:w.toLowerCase(),a:(matchIng(w)||'').toLowerCase()}));
  const split=x=>x.split(/[\s\-]+/).filter(Boolean);
  const hit=(name,h)=>{const n=name.toLowerCase();if(n===h.c)return true;const nt=split(n);
    return [h.c,h.t].some(t=>{const w=split(t);return w.length&&w.every(x=>x.length>=3&&nt.some(y=>y.startsWith(x)))})};
  const MODS=['schnell','aufwendig','aufwendiger','vegetarisch','vegan'];
  const modOK=(r,m)=>m==='schnell'?r.cat==='schnell':m.startsWith('aufwendig')?r.cat==='aufwendig':m==='vegetarisch'?RDIET[r.diet]<=1:r.diet==='vegan';
  const mods=wish.filter(x=>MODS.includes(x.w)).map(x=>x.w),wish2=wish.filter(x=>!MODS.includes(x.w));
  const res=[];
  for(const r of recipes()){
    if(!ps.every(p=>canEat(p,r)))continue;
    if(!mods.every(m=>modOK(r,m)))continue;
    const names=[...new Set(r.ings.filter(i=>!(ING[i.n]&&ING[i.n].pantry)).map(i=>i.n))];
    const got=names.filter(n=>have.some(h=>hit(n,h))),miss=names.filter(n=>!got.includes(n));
    const addHit=(r.addons||[]).filter(a=>a.ings.some(i=>have.some(h=>hit(i.n,h)))).map(a=>a.label);
    const hay=(r.title+' '+names.join(' ')+' '+r.cat+' '+r.diet).toLowerCase();
    const wHit=wish2.filter(x=>hay.includes(x.w)||(x.a&&hay.includes(x.a)));
    if(have.length&&!got.length&&!addHit.length&&!wHit.length)continue;
    if(!have.length&&wish2.length&&!wHit.length)continue;
    if(!have.length&&!wish2.length&&!mods.length)continue;
    const score=(names.length&&have.length?got.length/names.length:0)+wHit.length*.4+(addHit.length?.15:0)+(S.favs[r.id]?.05:0);
    res.push({r,got,miss,addHit,wHit,score,total:names.length});
  }
  res.sort((a,b)=>b.score-a.score);gen.res=res.slice(0,12);gen.msg='';gen.open=true;render()}

  const stat={};rows.forEach(x=>{const t=stat[x.r.id]||(stat[x.r.id]={r:x.r,n:0,last:x.k});t.n++;if(x.k>t.last)t.last=x.k});

async function errText(r){let j={};try{j=await r.json()}catch(e){}const m=j.msg||j.error_description||j.message||j.hint||('Fehler '+r.status);return MSG[m]||m}
function saveAuth(){try{auth?localStorage.setItem(AUTHKEY,JSON.stringify(auth)):localStorage.removeItem(AUTHKEY)}catch(e){}}
function takeSession(j,email){auth={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),email:(j.user&&j.user.email)||email};saveAuth()}
async function refreshAuth(){if(!auth||!auth.refresh_token)return false;
  try{const r=await fetch(SB.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:auth.refresh_token})});
    if(!r.ok){auth=null;HH=null;saveAuth();setSync('');return false}takeSession(await r.json(),auth.email);return true}catch(e){return false}}
async function sbFetch(path,opt,retry=true){opt=opt||{};
  if(auth&&auth.expires_at&&auth.expires_at-Date.now()/1000<60&&retry)await refreshAuth();
  const h=Object.assign({apikey:SB.key,'Content-Type':'application/json'},opt.headers||{});
  h.Authorization='Bearer '+((auth&&auth.access_token)||SB.key);
  const r=await fetch(SB.url+path,Object.assign({},opt,{headers:h}));
  if(r.status===401&&auth&&retry&&await refreshAuth())return sbFetch(path,opt,false);
  return r}
async function authCall(kind,email,pw){
  const url=kind==='up'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';

  if(S.settings&&(S.settings.worker||S.settings.token))m['setting|worker']={kind:'setting',key:'worker',data:S.settings};
  return m}
function schedulePush(){if(!cloudOn())return;clearTimeout(pt);pt=setTimeout(()=>{pt=null;pushDiff()},600)}
async function pushDiff(){
  if(!cloudOn())return;if(pushing){again=true;return}
  const cur=localRows(),batch=[];
  for(const id in cur){const js=canon(cur[id].data);if(lastPushed[id]!==js)batch.push({id,js,row:{household_id:HH.id,kind:cur[id].kind,key:cur[id].key,data:cur[id].data,deleted:false}})}
  for(const id in lastPushed){if(!(id in cur)&&lastPushed[id]!=='DEL'){const i=id.indexOf('|');batch.push({id,js:'DEL',row:{household_id:HH.id,kind:id.slice(0,i),key:id.slice(i+1),data:{},deleted:true}})}}
  if(!batch.length)return;
  pushing=true;
  try{const r=await sbFetch('/rest/v1/items?on_conflict=household_id,kind,key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(batch.map(b=>b.row))});
    if(!r.ok)throw new Error(await errText(r));
    batch.forEach(b=>lastPushed[b.id]=b.js);setSync('verbunden')}
  catch(e){setSync('Sync-Fehler');console.warn(e)}
  finally{pushing=false;if(again){again=false;schedulePush()}}}
async function fetchRows(since){
  const q='/rest/v1/items?select=kind,key,data,deleted,updated_at&household_id=eq.'+HH.id+(since?'&updated_at=gt.'+encodeURIComponent(since):'')+'&order=updated_at.asc&limit=5000';
  const r=await sbFetch(q);if(!r.ok)throw new Error(await errText(r));return r.json()}
async function pullAll(){applyRows(await fetchRows(''),true)}
async function poll(){if(!cloudOn()||pushing||pt)return;
  try{const rows=await fetchRows(lastTs);if(rows.length)applyRows(rows,false);setSync('verbunden')}catch(e){setSync('offline')}}
function applyRows(rows,full){
  const kinds=new Set(rows.map(r=>r.kind));
  S.persons.forEach((p,i)=>{if(p.o==null)p.o=i});
  if(full){lastTs='';if(kinds.has('person'))S.persons=[];if(kinds.has('recipe'))S.custom=[];if(kinds.has('plan'))S.plan={};if(kinds.has('fav'))S.favs={};if(kinds.has('check'))S.checked={};if(kinds.has('ing'))S.customIng={};if(kinds.has('rating'))S.ratings={}}
  let changed=false;
  for(const r of rows){const id=r.kind+'|'+r.key;if(r.updated_at>lastTs)lastTs=r.updated_at;
    const js=r.deleted?'DEL':canon(r.data);if(!full&&lastPushed[id]===js)continue;
    lastPushed[id]=js;changed=true;
    switch(r.kind){
      case'person':S.persons=S.persons.filter(p=>p.id!==r.key);if(!r.deleted)S.persons.push(Object.assign({},r.data,{id:r.key}));break;
      case'recipe':S.custom=S.custom.filter(x=>x.id!==r.key);if(!r.deleted)S.custom.push(r.data);break;
      case'plan':if(r.deleted)delete S.plan[r.key];else S.plan[r.key]=r.data;break;
      case'fav':if(r.deleted)delete S.favs[r.key];else S.favs[r.key]=true;break;
      case'check':if(r.deleted)delete S.checked[r.key];else S.checked[r.key]=r.data;break;
      case'rating':S.ratings=S.ratings||{};if(r.deleted)delete S.ratings[r.key];else S.ratings[r.key]=r.data.v;break;
      case'ing':S.customIng=S.customIng||{};if(r.deleted){delete S.customIng[r.key];delete ING[r.key]}else S.customIng[r.key]=r.data;break;
      case'setting':if(!r.deleted)S.settings=r.data;break}}
  applyCustomIng();
  S.persons.sort((a,b)=>(a.o==null?99:a.o)-(b.o==null?99:b.o));
  if(!S.persons.length)S.persons=defaults().persons;
  if(changed||full){saveLocal();render()}}

  const k=el.dataset.k;
  switch(a){
   case'tab':if(el.dataset.t==='plan'&&tab==='day'&&dayK)weekOff=Math.round((mondayOf(dayK)-mondayOf(iso(new Date())))/6048e5);tab=el.dataset.t;render();window.scrollTo(0,0);break;
   case'wk':weekOff+=+el.dataset.d;render();break;
   case'sug':suggest(k,el.dataset.cat);break;
   case'clear':delete S.plan[k];save();closeModal();render();break;
   case'fill':fillWeek(false);break;
   case'refill':fillWeek(true);break;
   case'lock':{const e=entry(k);e.lock=!e.lock;save();render();break};
   case'pick':{const e=S.plan[k]||{eaters:defE(k)};const ps=eaterSet(e);
     modal(`<div class="row sp"><h2 style="margin:0">Rezept wählen</h2><button class="bt sm sec" data-act="close">✕</button></div>`+recipes().slice().sort((a,b)=>!!S.favs[b.id]-!!S.favs[a.id]).map(r=>{const ok=ps.every(p=>canEat(p,r));return `<div class="card" ${ok?`data-act="setrec" data-k="${k}" data-id="${r.id}" style="cursor:pointer"`:'style="opacity:.45"'}><b>${S.favs[r.id]?'❤️ ':''}${esc(r.title)}</b> <span class="badge">${TYPES[r.type]}</span><div class="mu">${r.min} Min${ok?'':' · passt nicht zu den Mitessern'}</div></div>`}).join(''));break}
   case'setrec':{const e=entry(k);e.rid=el.dataset.id;e.addons={};save();closeModal();render();break}
   case'open':recipeModal(el.dataset.id);break;
   case'close':closeModal();break;
   case'newrec':case'imp-manual':recipeForm();break;
   case'imp-link':doLink();break;
   case'imp-text':doText();break;
   case'saverec':saveRecipe();break;
   case'delrec':if(confirm('Rezept löschen?')){S.custom=S.custom.filter(r=>r.id!==el.dataset.id);Object.values(S.plan).forEach(e=>{if(e.rid===el.dataset.id)e.rid=null});save();closeModal();render()}break;
   case'addp':S.persons.push({id:'p'+Date.now(),name:'Neue Person',age:'',diet:'alles',exclude:'',likes:'',protein:'',factor:1});save();render();break;
   case'delp':if(confirm('Person entfernen?')){S.persons=S.persons.filter(p=>p.id!==el.dataset.p);Object.values(S.plan).forEach(e=>e.eaters=e.eaters.filter(x=>x!==el.dataset.p));save();render()}break;
   case'fav':toggleFav(el.dataset.id);break;
   case'hmode':hmode=el.dataset.m;render();break;
   case'login':doAuth('in');break;
   case'register':doAuth('up');break;
   case'mkhh':doCreate();break;
   case'joinhh':doJoin();break;
   case'logout':doLogout();break;
   case'syncnow':accS('Synchronisiere…');pushDiff().then(()=>loadHH()).then(()=>{render()}).catch(e=>accS(e.message));break;
   case'gensearch':gen.have=document.getElementById('gen_have').value;gen.wish=document.getElementById('gen_wish').value;genSearch();break;
   case'genai':genAI();break;
   case'gentoggle':gen.have=(document.getElementById('gen_have')||{}).value||gen.have;gen.wish=(document.getElementById('gen_wish')||{}).value||gen.wish;gen.open=!gen.open;render();break;
   case'genadopt':{const x=gen.ai&&gen.ai[+el.dataset.i];if(x)recipeForm({title:x.title,serv:x.serv,min:x.min,ings:x.ings.join('\n'),steps:x.steps.join('\n'),diet:x.diet});break}
   case'nutri':nutriAsk(el.dataset.c,JSON.parse(el.dataset.names),el.dataset.rid);break;
   case'ntsave':ntSave(el);break;
   case'prep':{const e=entry(k);e.prep=!e.prep;save();render();break}
   case'rate':rateRecipe(el.dataset.id,+el.dataset.v);break;
   case'editrec':{const r=rec(el.dataset.id);if(r)recipeForm(toPre(r));break}
   case'resetrec':if(confirm('Eigene Änderungen verwerfen und das Original wiederherstellen?')){S.custom=S.custom.filter(r=>r.id!==el.dataset.id);save();recipeModal(el.dataset.id);render()}break;
   case'ics':downloadIcs();break;
   case'eatert':{const e=entry(k),id=el.dataset.p;e.eaters=e.eaters.includes(id)?e.eaters.filter(x=>x!==id):[...e.eaters,id];save();render();break}
   case'jump':{const t=document.getElementById('day-'+k);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});break}
   case'dopen':uiOpen[k]=!uiOpen[k];render();break;
   case'dmore':{const dd=new Date(k+'T12:00');modal(`<h2>${DAYN[(dd.getDay()+6)%7]}, ${pad(dd.getDate())}.${pad(dd.getMonth()+1)}.</h2><div class="stack"><button class="bt sec" data-act="pick" data-k="${k}">Anderes Rezept wählen</button><button class="bt dng" data-act="clear" data-k="${k}">Tag leeren</button></div>`);break}
   case'openday':dayK=k;tab='day';render();window.scrollTo(0,0);break;
   case'dayp':dayP=el.dataset.p;render();break;
   case'copy':{const g=shopList();const t=Object.keys(g).map(k=>k+':\n'+g[k].map(x=>'- '+x.n+' '+x.txt).join('\n')).join('\n\n');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Liste kopiert')).catch(()=>prompt('Liste:',t));break}
  }});
document.addEventListener('change',ev=>{
  const el=ev.target;const a=el.dataset.act;
  if(a==='imp-photo'){doPhoto(el.files&&el.files[0]);return}
  if(a==='geneater'){const id=el.dataset.p,cur=genIds();gen.eaters=el.checked?[...new Set([...cur,id])]:cur.filter(x=>x!==id);return}
  if(el.dataset.set){S.settings=S.settings||{};S.settings[el.dataset.set]=el.value.trim();save();return}
  if(el.dataset.pday!==undefined){const p=person(el.dataset.p);if(p){const cur=p.days||[0,1,2,3,4,5,6],i=+el.dataset.pday;p.days=el.checked?[...new Set([...cur,i])].sort():cur.filter(x=>x!==i);save()}return}
  if(el.dataset.pf){const p=person(el.dataset.p);if(p){p[el.dataset.pf]=el.type==='number'&&el.dataset.pf==='factor'?(parseFloat(el.value)||1):el.value;save();if(el.dataset.pf==='name'||el.dataset.pf==='diet')render()}return}
  if(a==='eater'){const e=entry(el.dataset.k);const id=el.dataset.p;e.eaters=el.checked?[...new Set([...e.eaters,id])]:e.eaters.filter(x=>x!==id);save();render()}
  else if(a==='addon'){const e=entry(el.dataset.k);e.addons=e.addons||{};e.addons[el.dataset.p]=+el.value;save();render()}
  else if(a==='chk'){const ws=el.dataset.ws;S.checked[ws]=S.checked[ws]||{};S.checked[ws][el.dataset.n]=el.checked;save();render()}
  else if(a==='rcat'){rcat=el.value;render()}else if(a==='rtype'){rtype=el.value;render()}});
document.addEventListener('input',ev=>{if(ev.target.id==='rq'){rq=ev.target.value;render()}if(ev.target.id==='f_i')updateWarn();if(ev.target.id==='gen_have')gen.have=ev.target.value;if(ev.target.id==='gen_wish')gen.wish=ev.target.value});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&(ev.target.id==='gen_have'||ev.target.id==='gen_wish')){gen.have=document.getElementById('gen_have').value;gen.wish=document.getElementById('gen_wish').value;genSearch()}});
document.addEventListener('keydown',ev=>{const el=ev.target;if((ev.key==='Enter'||ev.key===' ')&&el.getAttribute&&el.getAttribute('role')==='button'&&el.dataset.act){ev.preventDefault();el.click()}});
let tx=null,ty=null;
document.addEventListener('touchstart',ev=>{if(tab!=='day'||document.querySelector('.modal'))return;tx=ev.touches[0].clientX;ty=ev.touches[0].clientY},{passive:true});
document.addEventListener('touchend',ev=>{if(tx===null)return;const dx=ev.changedTouches[0].clientX-tx,dy=ev.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)>70&&Math.abs(dy)<50)shiftDay(dx<0?1:-1)},{passive:true});
render();boot();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
